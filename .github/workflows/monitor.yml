name: Baekje Nakhwa Telegram Watch

on:
  schedule:
    - cron: '2/5 * * * *'  # approximately every 5 minutes (UTC scheduling; may be delayed)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baekje-nakhwa-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium automation
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Check Naver ticket UI and send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' }}
          DEBUG_SCREENSHOT: ${{ github.event_name == 'workflow_dispatch' }}
        run: python monitor.py
      - name: Save detected visibility state
        run: |
          if [ -f .monitor_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .monitor_state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update Nakhwa ticket visibility state'
              git push
            fi
          fi
      - name: Attach diagnostic screenshot (manual tests only)
        if: ${{ github.event_name == 'workflow_dispatch' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: naver-page-diagnostics
          path: debug/
          if-no-files-found: ignore
          retention-days: 2

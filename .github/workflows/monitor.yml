name: Baekje Nakhwa Telegram Watch

on:
  schedule:
    # GitHub starts no more frequently than every five minutes (UTC).
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Only one job changes the stored alert state at any one time.
concurrency:
  group: baekje-nakhwa-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean fonts and Python dependency
        run: |
          if ! fc-list :lang=ko family | grep -q '[^[:space:]]'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-nanum
            fc-cache -f
          fi
          python -m pip install 'playwright==1.58.0'
          google-chrome --version
      - name: Check Naver booking calendar every ~60 seconds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' }}
          DEBUG_SCREENSHOT: ${{ github.event_name == 'workflow_dispatch' }}
        run: python monitor.py
      - name: Save alert state for next run
        if: ${{ always() }}
        run: |
          if [ -f .monitor_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .monitor_state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update Nakhwa watch alert state'
              git push
            fi
          fi
      - name: Diagnostic screenshots (manual tests only)
        if: ${{ github.event_name == 'workflow_dispatch' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: naver-page-diagnostics
          path: debug/
          if-no-files-found: ignore
          retention-days: 2
